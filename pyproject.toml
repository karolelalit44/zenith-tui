[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.hatch.build]
exclude = ["server/tests"]

[project]
name = "zenith"
version = "0.1.0"
description = "Zenith AI Coding Assistant Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "aiosqlite>=0.20,<1.0",
    "pydantic>=2.0,<3.0",
    "click>=8.1,<9.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "websockets>=12.0,<14.0",
    "json_repair>=0.61,<1.0",
]

[project.optional-dependencies]
llm = [
    "litellm>=1.35,<2.0",
    "tiktoken>=0.7,<1.0",
]
git = [
    "gitpython>=3.1,<4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
zenith = "server.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]
pythonpath = ["."]
markers = [
    "slow: tests that require a live server subprocess (use: pytest -m slow)",
]
addopts = "--ignore=server/tests/e2e_real.py --ignore=server/tests/test_e2e_websocket.py --ignore=server/tests/test_e2e_integration.py"

[tool.ruff]
line-length = 100
extend-exclude = ["ref_repo"]

[tool.ruff.lint.per-file-ignores]
"server/tests/conftest.py" = ["E402"]  # env vars must be set before zenith imports

[tool.mypy]
python_version = "3.12"
exclude = [
    "ref_repo/",
    "test_api\\.py$",
    "\\.venv/",
]
