version: '3.8'

services:
  rgmb-hub:
    build: .
    ports:
      - "8000:8000"
    restart: always
    environment:
      - MODULE_NAME=main
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
